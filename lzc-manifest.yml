application:
  subdomain: moontvplus
  multi_instance: false
  upstreams:
    - location: /
      backend: http://moontv-core:3000/
      fix_websocket_header: true
  public_path:
    - /
  injects:
    - id: moontvplus-login
      on: browser
      when:
        - /login
      do:
        - src: builtin://simple-inject-password
          params:
            user: "{{ .U.username }}"
            password: "{{ .U.password }}"
services:
  moontv-core:
    # upstream: ghcr.io/mtvpls/moontvplus:v225.1.0
    image: ghcr.1ms.run/mtvpls/moontvplus:v225.1.0
    run_as: 0
    depends_on:
      - moontv-kvrocks
    environment:
      - "USERNAME={{ .U.username }}"
      - "PASSWORD={{ .U.password }}"
      - NEXT_PUBLIC_STORAGE_TYPE=kvrocks
      - KVROCKS_URL=redis://moontv-kvrocks:6666
      - CRON_PASSWORD={{ stable_secret "cron_password" }}
    binds:
      - /lzcapp/var/moontvplus/downloads:/data
  moontv-kvrocks:
    # upstream: docker.io/apache/kvrocks:2.15.0
    image: docker.1ms.run/apache/kvrocks:2.15.0
    run_as: 0
    binds:
      - /lzcapp/var/moontvplus/kvrocks:/var/lib/kvrocks/db
usage: |
  Sign in at /login with the username and password selected during installation. The application starts without built-in video or live sources; add only sources you are authorized to use. Kvrocks state and server-side offline downloads persist in application storage.
